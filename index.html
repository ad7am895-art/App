<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق صلاتي الفاخر</title>
    
    <!-- PWA & Theme Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2833/2833442.png">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-card: rgba(255, 255, 255, 0.05);
            --border-card: rgba(212, 175, 55, 0.2);
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --accent-green: #10b981;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 20%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .title-group h1 {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.5rem;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-badge {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
        }

        /* Main Prayer Card */
        .hero-card {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(16, 185, 129, 0.05) 100%);
            border: 1px solid var(--gold-primary);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .next-prayer-title {
            font-size: 0.9rem;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .next-prayer-name {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 2.2rem;
            color: var(--gold-primary);
            margin: 5px 0;
        }

        .countdown-timer {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            direction: ltr;
            margin-top: 5px;
        }

        /* Tab Navigation */
        .nav-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 4px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            background: var(--gold-primary);
            color: #000;
            font-weight: 700;
        }

        /* Content Sections */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Prayer Times List */
        .prayer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            transition: 0.3s;
        }

        .prayer-item.active {
            border-color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.1);
        }

        .prayer-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .prayer-name {
            font-weight: 600;
        }

        .prayer-time {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold-light);
            direction: ltr;
        }

        /* Tasbeeh Counter */
        .counter-box {
            text-align: center;
            padding: 30px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .count-display {
            font-size: 4rem;
            font-weight: 700;
            color: var(--gold-primary);
            font-family: 'Tajawal', sans-serif;
            line-height: 1;
        }

        .btn-tap {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, rgba(0,0,0,0) 70%);
            color: var(--gold-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .btn-tap:active {
            transform: scale(0.92);
        }

        .btn-reset {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Qibla Compass Placeholder */
        .compass-container {
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-card);
        }

        .compass-dial {
            width: 150px;
            height: 150px;
            border: 4px solid var(--gold-primary);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.5s ease-out;
        }

        .compass-pointer {
            font-size: 2.5rem;
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="title-group">
                <h1><i class="fa-solid fa-kaaba"></i> صلاتي</h1>
                <div class="location-badge" id="location">
                    <i class="fa-solid fa-location-dot"></i> جاري تحديد الموقع...
                </div>
            </div>
            <div id="hijri-date" style="font-size: 0.85rem; color: var(--gold-light); text-align: left;">-- --- ----</div>
        </header>

        <!-- Next Prayer Hero -->
        <div class="hero-card">
            <div class="next-prayer-title">الصلاة القادمة</div>
            <div class="next-prayer-name" id="next-prayer-name">--</div>
            <div class="countdown-timer" id="countdown">00:00:00</div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('prayers')">
                <i class="fa-solid fa-clock"></i> المواقيت
            </button>
            <button class="tab-btn" onclick="switchTab('tasbeeh')">
                <i class="fa-solid fa-hands-praying"></i> المسبحة
            </button>
            <button class="tab-btn" onclick="switchTab('qibla')">
                <i class="fa-solid fa-compass"></i> القبلة
            </button>
        </nav>

        <!-- Tab 1: Prayer Times -->
        <section id="tab-prayers" class="tab-content active">
            <div class="prayer-item" id="item-Fajr">
                <div class="prayer-info">
                    <i class="fa-solid fa-cloud-sun"></i>
                    <span class="prayer-name">الفجر</span>
                </div>
                <div class="prayer-time" id="time-Fajr">--:--</div>
            </div>
            <div class="prayer-item" id="item-Sunrise">
                <div class="prayer-info">
                    <i class="fa-solid fa-sun"></i>
                    <span class="prayer-name">الشروق</span>
                </div>
                <div class="prayer-time" id="time-Sunrise">--:--</div>
            </div>
            <div class="prayer-item" id="item-Dhuhr">
                <div class="prayer-info">
                    <i class="fa-solid fa-sun"></i>
                    <span class="prayer-name">الظهر</span>
                </div>
                <div class="prayer-time" id="time-Dhuhr">--:--</div>
            </div>
            <div class="prayer-item" id="item-Asr">
                <div class="prayer-info">
                    <i class="fa-solid fa-cloud-sun font-1"></i>
                    <span class="prayer-name">العصر</span>
                </div>
                <div class="prayer-time" id="time-Asr">--:--</div>
            </div>
            <div class="prayer-item" id="item-Maghrib">
                <div class="prayer-info">
                    <i class="fa-solid fa-moon"></i>
                    <span class="prayer-name">المغرب</span>
                </div>
                <div class="prayer-time" id="time-Maghrib">--:--</div>
            </div>
            <div class="prayer-item" id="item-Isha">
                <div class="prayer-info">
                    <i class="fa-solid fa-star-and-crescent"></i>
                    <span class="prayer-name">العشاء</span>
                </div>
                <div class="prayer-time" id="time-Isha">--:--</div>
            </div>
        </section>

        <!-- Tab 2: Tasbeeh Counter -->
        <section id="tab-tasbeeh" class="tab-content">
            <div class="counter-box">
                <div class="count-display" id="counter-value">0</div>
                <button class="btn-tap" onclick="incrementCounter()">
                    <i class="fa-solid fa-fingerprint"></i>
                </button>
                <button class="btn-reset" onclick="resetCounter()">
                    <i class="fa-solid fa-rotate-right"></i> إعادة ضبط العداد
                </button>
            </div>
        </section>

        <!-- Tab 3: Qibla Compass -->
        <section id="tab-qibla" class="tab-content">
            <div class="compass-container">
                <div class="compass-dial" id="compass-dial">
                    <div class="compass-pointer"><i class="fa-solid fa-location-arrow"></i></div>
                </div>
                <p id="qibla-text" style="color: var(--text-muted);">حرك جهازك لتحديد اتجاه القبلة</p>
            </div>
        </section>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }

        // Global State Variables
        let prayerTimesData = null;
        let counter = 0;

        // UI Tabs Switcher
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.currentTarget.classList.add('active');

            if (tabName === 'qibla') {
                initQiblaCompass();
            }
        }

        // Fetch Prayer Times via Geolocation & Aladhan API
        function initApp() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const { latitude, longitude } = position.coords;
                        fetchPrayerTimes(latitude, longitude);
                    },
                    error => {
                        // Default to Mecca coordinates if permission denied
                        document.getElementById('location').innerText = "مكة المكرمة (افتراضي)";
                        fetchPrayerTimes(21.4225, 39.8262);
                    }
                );
            } else {
                fetchPrayerTimes(21.4225, 39.8262);
            }
        }

        async function fetchPrayerTimes(lat, lng) {
            try {
                const response = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=4`);
                const data = await response.json();
                
                if (data.code === 200) {
                    prayerTimesData = data.data.timings;
                    updateUI(data.data);
                    startCountdown();
                }
            } catch (err) {
                console.error("Error fetching timings:", err);
            }
        }

        function updateUI(data) {
            // Update Location Text
            document.getElementById('location').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${data.meta.timezone}`;
            
            // Update Hijri Date
            const hijri = data.date.hijri;
            document.getElementById('hijri-date').innerText = `${hijri.day} ${hijri.month.ar} ${hijri.year}`;

            // Fill Timings
            const prayers = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
            prayers.forEach(prayer => {
                const el = document.getElementById(`time-${prayer}`);
                if (el) el.innerText = prayerTimesData[prayer];
            });
        }

        // Calculate and display countdown
        function startCountdown() {
            setInterval(() => {
                if (!prayerTimesData) return;

                const now = new Date();
                const prayers = [
                    { name: 'الفجر', key: 'Fajr' },
                    { name: 'الظهر', key: 'Dhuhr' },
                    { name: 'العصر', key: 'Asr' },
                    { name: 'المغرب', key: 'Maghrib' },
                    { name: 'العشاء', key: 'Isha' }
                ];

                let nextPrayer = null;
                let minDiff = Infinity;

                prayers.forEach(prayer => {
                    const [hours, minutes] = prayerTimesData[prayer.key].split(':');
                    const prayerTime = new Date();
                    prayerTime.setHours(hours, minutes, 0);

                    let diff = prayerTime - now;
                    if (diff < 0) {
                        // If prayer time passed today, set to tomorrow
                        prayerTime.setDate(prayerTime.getDate() + 1);
                        diff = prayerTime - now;
                    }

                    if (diff < minDiff) {
                        minDiff = diff;
                        nextPrayer = prayer;
                    }
                });

                if (nextPrayer) {
                    document.getElementById('next-prayer-name').innerText = nextPrayer.name;
                    
                    // Format diff into HH:MM:SS
                    const h = Math.floor(minDiff / (1000 * 60 * 60));
                    const m = Math.floor((minDiff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((minDiff % (1000 * 60)) / 1000);

                    document.getElementById('countdown').innerText = 
                        `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                }
            }, 1000);
        }

        // Tasbeeh Logic
        function incrementCounter() {
            counter++;
            document.getElementById('counter-value').innerText = counter;
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function resetCounter() {
            counter = 0;
            document.getElementById('counter-value').innerText = counter;
        }

        // Qibla Compass Device Orientation Integration
        function initQiblaCompass() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', function(event) {
                    let compass = event.alpha;
                    if (compass !== null) {
                        document.getElementById('compass-dial').style.transform = `rotate(${-compass}deg)`;
                    }
                }, true);
            }
        }

        // Run application on load
        window.onload = initApp;
    </script>
</body>
</html>
